# ============================================================
# 暮想 Museve — Nginx 参考配置
# ------------------------------------------------------------
# 与旧版的区别（对应审计 M1 / L9 / N1）：
#   1. 全站 HTTPS + HSTS，80 端口只做跳转并放行 ACME 校验；
#   2. 显式拒绝 docs/ backups/ scripts/ tools/ 与所有敏感后缀 ——
#      这些目录一旦留在 webroot 就是公开可下载的；
#   3. 补 fastcgi_param HTTPS，PHP 侧才能正确判定协议
#      （Secure Cookie、HSTS 都依赖它）。
#
# 若使用宝塔面板，只需要把 location 段粘进"伪静态"里，证书与跳转交给面板。
# nginx ≥ 1.25.1 请把 `listen 443 ssl http2;` 改成 `listen 443 ssl;` + `http2 on;`
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Let's Encrypt 续期校验必须走明文
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    root /www/wwwroot/example.com;
    index index.php;
    charset utf-8;

    # 上传体积上限：需 ≥ 后台"最大上传大小"设置，留一点表单开销余量
    client_max_body_size 16m;

    # ---------- 证书 ----------
    ssl_certificate     /www/server/panel/vhost/cert/example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS：确认全站 HTTPS 可用后再开，开了就别轻易撤（max-age 会被浏览器记住）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 其余安全头（CSP / X-Frame-Options / Referrer-Policy / nosniff）
    # 由 PHP 统一输出，见 includes/connect.php 的 sendSecurityHeaders()，
    # 避免两处各写一份、改一处忘一处。

    # ---------- 拒绝敏感路径 ----------
    # 隐藏文件（保留 ACME 目录）
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 开发/运维产物，不应出现在站点根目录
    location ^~ /docs/     { deny all; }
    location ^~ /backups/  { deny all; }
    location ^~ /scripts/  { deny all; }
    location ^~ /tools/    { deny all; }

    # 源码与配置类后缀
    location ~* \.(md|conf|sql|sh|bak|ini|lock|log|swp|mjs|ts|map)$ {
        deny all;
    }

    # 服务端代码目录
    location ~ ^/(includes|admin/api/auth_helper) {
        deny all;
    }

    # ---------- 路由 ----------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location /admin {
        try_files $uri $uri/ /admin/index.php?$args;
    }

    location /api/ {
        try_files $uri $uri/ /api/$uri.php?$args;
    }

    location /admin/api/ {
        try_files $uri $uri/ /admin/api/$uri.php?$args;
    }

    # ---------- PHP ----------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # 关键：让 PHP 侧知道当前是 HTTPS，否则 Secure Cookie 与 HSTS 都不会生效
        fastcgi_param HTTPS $https if_not_empty;
    }

    error_page 404 /404.html;

    # 静态资源缓存：文件名带 ?v= 版本号，可长缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
